name: intel_v1
# Daily threat-intel scan of this repository's lockfiles. Keeps one living issue:
# opened or updated when there are findings or a blind source, closed on a quiet day.
on:
  schedule:
    - cron: "23 11 * * *"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Test
        run: python3 -I -m unittest discover -s intel/tests
      - name: Scan
        id: scan
        run: |
          set +e
          python3 -I intel/intel_scan_v1.py --no-save --out "$RUNNER_TEMP/intel" > "$RUNNER_TEMP/report.md"
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: Update issue
        env:
          GH_TOKEN: ${{ github.token }}
          CODE: ${{ steps.scan.outputs.code }}
        run: |
          title="intel: open findings"
          # Only an issue this workflow opened counts, so nobody else's issue can be taken over.
          num=$(gh issue list --state open --author "app/github-actions" --search "\"$title\" in:title" \
            --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ "$CODE" = "0" ]; then
            if [ -n "$num" ]; then gh issue close "$num" --comment "Quiet run: nothing new."; fi
            exit 0
          fi
          if [ -n "$num" ]; then gh issue edit "$num" --body-file "$RUNNER_TEMP/report.md"
          else gh issue create --title "$title" --body-file "$RUNNER_TEMP/report.md"; fi
